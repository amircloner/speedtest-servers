[project]
name = "speedtest-servers"
version = "0.1.0"
description = "Speedtest GUI – fetch and benchmark Speedtest.net servers"
requires-python = ">=3.10"

# Factor II – Dependencies: all deps declared explicitly with pinned ranges.
# Use `uv lock` / `pip-compile` to produce a fully-locked uv.lock / requirements.txt.
dependencies = [
    "flask==3.0.3",
    "gunicorn==22.0.0",
    "speedtest-cli==2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]

[tool.uv]
# Factor II – Dependencies: dev extras stay out of production image
dev-dependencies = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
